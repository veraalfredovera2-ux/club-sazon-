name: Compilar APK Android

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Renombrar logo para Android
        run: |
          if [ -f 20261104_204552_0000.png ]; then
            mv 20261104_204552_0000.png logo.png
            sed -i 's/20261104_204552_0000\.png/logo.png/g' app.json App.js pantallas.js admin.js rider.js 2>/dev/null || true
          fi

      - name: Instalar dependencias y EAS
        run: |
          npm install
          npm install -g eas-cli

      - name: Vincular proyecto y generar APK
        env:
          RAW_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          export EXPO_TOKEN=$(printf '%s' "$RAW_TOKEN" | tr -d '[:space:]()')
          eas init --non-interactive --force
          eas build --platform android --profile preview --non-interactive --no-wait
